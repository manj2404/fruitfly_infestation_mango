<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Phenology Model{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<div class="auth-shell">

  <div class="auth-art">
    <div class="auth-art-inner">
      <span class="auth-brand-mark">
        <svg viewBox="0 0 40 40" width="34" height="34" fill="none">
          <path d="M20 4C12 4 6 11 6 20c0 8 6 16 14 16s14-8 14-16c0-4-1.5-7-4-9.5-1 2-3 3.5-5 3.5C22 14 21 9 24 4c-1.5.5-3 .8-4 0z" fill="currentColor"/>
          <path d="M23 5c2-2 5-3 8-2-1 3-4 5-7 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <h1>Temperature-Based Phenology Model</h1>
      <p>Fruit fly detection for mango orchards, using Growing Degree Days.</p>
      <ul class="auth-highlights">
        <li>🪰 Mango &amp; infection detection</li>
        <li>🌡 GDD-based life-stage prediction</li>
        <li>🌐 Full bilingual support (English &amp; தமிழ்)</li>
      </ul>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      {% block auth_content %}{% endblock %}
    </div>
  </div>

</div>

</body>
</html>
