<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Phenology Model{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<div class="auth-shell">

  <div class="auth-art">
    <div class="auth-art-inner">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Fruit Fly Detection logo" class="auth-logo-img">
      <span class="auth-eyebrow-badge">Mango Orchard Intelligence</span>
      <p class="auth-tagline">Early Detection · Healthy Orchards</p>
      <ul class="auth-highlights">
        <li>🪰 Mango &amp; infection detection</li>
        <li>🌡 GDD-based life-stage prediction</li>
        <li>🌐 Full bilingual support (English &amp; தமிழ்)</li>
      </ul>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      {% block auth_content %}{% endblock %}
    </div>
  </div>

</div>

</body>
</html>
